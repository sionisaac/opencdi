[package]
name = "opencdi"
version = "0.2.4"
edition = "2024"

[features]
default = ["host"]
host = ["dep:winit", "dep:softbuffer", "dep:cpal", "dep:gilrs", "dep:env_logger", "dep:png", "dep:serde_json"]

[workspace]

[[bin]]
name = "opencdi"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "debug_games"
path = "src/bin/debug_games.rs"
required-features = ["host"]

[[bin]]
name = "test_audio_trace"
path = "src/bin/test_audio_trace.rs"
required-features = ["host"]

[[bin]]
name = "test_dvc"
path = "src/bin/test_dvc.rs"
required-features = ["host"]

[[bin]]
name = "test_vcd"
path = "src/bin/test_vcd.rs"
required-features = ["host"]

[[bin]]
name = "test_boot_disc"
path = "src/bin/test_boot_disc.rs"
required-features = ["host"]

[dependencies]
bincode = "1.3.3"
byteorder = "1.5.0"
chd = "0.3.4"
cpal = { version = "0.18.2", optional = true }
env_logger = { version = "0.11.11", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
gilrs = { version = "0.11.2", optional = true }
log = "0.4.34"
m68k = { version = "0.12.1", features = ["serde"] }
oxideav-mp2 = "0.0.10"
png = { version = "0.18", optional = true }
quick-xml = "0.41.0"
serde_json = { version = "1", optional = true }
softbuffer = { version = "0.4.8", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = { version = "0.30.13", optional = true }

[patch.crates-io]
m68k = { path = "crates/m68k" }

[build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
